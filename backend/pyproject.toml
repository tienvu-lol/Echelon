[project]
name = "echelon-backend"
version = "0.1.0"
description = "Echelon - Campus Opportunity Navigator API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "google-genai>=2.3.0",
    "databricks-sdk>=0.36.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.10",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
